name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and prepare APK
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" output/guaca-v1.0.0.apk
          cp "$APK_PATH" output/guaca.apk
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guaca-v1.0.0-apk
          path: output/guaca-v1.0.0.apk

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 > /dev/null 2>&1; then
            echo "Release v1.0.0 already exists. Uploading APK asset..."
            gh release upload v1.0.0 output/guaca-v1.0.0.apk --clobber
          else
            echo "Creating new release v1.0.0..."
            gh release create v1.0.0 output/guaca-v1.0.0.apk \
              --title "Guaca v1.0.0 — Lanzamiento Oficial" \
              --notes "Versión oficial y libre de Guaca: 100% Offline-First, Mínimo Vital mensual, Coach Gemini Flash y cero suscripciones."
          fi
